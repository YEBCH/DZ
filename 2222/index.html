<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MDN</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    
    <form class="form">
        <fieldset class="form-group">
            <legend class="form-group-title">Ваши личные данные</legend>
            <label for="name" class="label">Ваше имя</label>
            <input id="name" type="text" class="input" placeholder="имя" name="name" required>

            <label for="age" class="label">Ваш возраст</label>
            <input id="age" type="number" class="input" placeholder="Возраст " name="age" required>

            <label for="phone" class="label">Ваш телефон</label>
            <input id="phone" type="tel" class="input" placeholder="телефон" name="fhone" required>

            <label for="email" class="label">Ваша почта</label>
            <input id="email" type="email" class="input" placeholder="почта" name="email" required>

        </fieldset>

        <fieldset class="form-group">
            <label for="message" class="label">сообщение</label>
            <textarea id="message" class="textarea" placeholder="ваше сообщение" name="name" required></textarea>

        <label class="label">
            <input class="checkbox" type="checkbox" name="checkbox" required>
            <span class="checkbox-text">Я принимаю правила</span>
        </label>

        </fieldset>
    <button class="button">отправить</button>
</form>
    

</body>

</html>
